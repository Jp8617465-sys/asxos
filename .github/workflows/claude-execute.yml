# Claude Execute — attended-triggered automation harness.
#
# Runs Claude Code inside GitHub Actions via anthropics/claude-code-action@v1
# so repo work (build/fix/runbook tasks) can be dispatched with
# `gh workflow run claude-execute.yml -f prompt="..."` instead of driving
# everything from an interactive chat session.
#
# Required repo secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — minted via `claude setup-token` (bills usage to
#     the Claude subscription, not a metered API key).
#   ARBI_GITHUB_TOKEN — a fine-grained PAT scoped to this repo with Contents,
#     Pull requests, Actions, Workflows and Issues write. It is BOTH the
#     checkout credential and GH_TOKEN, and both matter:
#       - as GH_TOKEN it lets arbi drive `gh` (the default GITHUB_TOKEN cannot
#         start new workflow runs from within a run);
#       - as the CHECKOUT token it is what makes pushes trigger other
#         workflows. `persist-credentials: true` alone persists GITHUB_TOKEN,
#         and a push made with GITHUB_TOKEN deliberately does NOT trigger
#         workflows — so `full-check` would never fire on the PR arbi opens,
#         and arbi would either wait forever or merge on nothing green.
#   SUPABASE_ACCESS_TOKEN — read/write Supabase MCP, so `apply_migration`
#     exists in a headless run (AGENTS.md §8's migration sequence).
#
# Safety model: workflow_dispatch only — no automatic event triggers, because
# repo events can carry untrusted text. Tooling is no longer fenced by a
# per-lane tool allowlist; the run is `--permission-mode auto`, so the
# classifier reviews everything that is not one of the sanctioned shapes
# pre-approved in `.github/runner/claude-user-settings.json`. The `main`
# ruleset (PR required, `full-check` on the current head, squash, linear
# history, no force push, empty bypass list) is the server-side backstop and
# binds this credential too. Repo rules in AGENTS.md and CLAUDE.md (incl. rule
# #11 Model A quarantine and the §2 reserved domain) load with the checkout and
# apply to every run.

name: Claude Execute

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for Claude to execute"
        required: true
        type: string
      max_turns:
        description: "Maximum agent turns"
        required: false
        # Raised 20 -> 40 on 2026-09-10: the lane now lands its own work
        # (AGENTS.md §8) rather than stopping at a draft, so a budget sized for
        # "build and hand over" truncates mid-run and reads as a lane that just
        # stopped.
        default: "40"
        type: string
      run_tests:
        description: "Run relevant tests before declaring done"
        required: false
        default: true
        type: boolean
      debug:
        description: "Log Claude's full transcript (see show_full_output note below)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write  # required by claude-code-action's OIDC token exchange

concurrency:
  group: claude-execute
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # The PAT, not the default GITHUB_TOKEN. A push authenticated with
          # GITHUB_TOKEN does not trigger other workflows, so full-check would
          # never run on the PR this lane opens. See the header.
          token: ${{ secrets.ARBI_GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The classifier ignores `autoMode` in project settings, so the auto-mode
      # context and its four sanctioned exceptions have to be user-level. A
      # headless `-p` run also defaults to Manual without --permission-mode,
      # where every unlisted action is denied with no prompt and the run looks
      # successful having done nothing.
      - name: Install user-level Claude settings for auto mode
        run: |
          mkdir -p ~/.claude
          cp .github/runner/claude-user-settings.json ~/.claude/settings.json

      - name: Install project with test dependencies
        if: ${{ inputs.run_tests }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]"
          pip install pytest pytest-asyncio

      # Pinned to an immutable commit, not the mutable `v1` tag. This is the
      # highest-privilege action in the repo — the job grants contents/PR/issues/
      # actions write plus id-token — so a repointed tag here has the widest blast
      # radius of any dependency the repo has. Note `v1` is an ANNOTATED tag: the
      # ref resolves to tag object 8569a83, and the commit below is that tag
      # dereferenced. Pinning the tag object instead would not resolve.
      # Dependabot (.github/dependabot.yml) owns keeping this current.
      - uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590  # v1.0.223, bundles Claude Code 2.1.270
        env:
          GH_TOKEN: ${{ secrets.ARBI_GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # OPT-IN ONLY (default false). The action's own docs warn that this
          # logs every Claude message including tool results, "which may contain
          # secrets, API keys, or other sensitive information." Accepting that
          # warning permanently is not justified here: this repo's own docs carry
          # real position data (e.g. the HUBS lot in
          # .claude/rules/portfolio-conventions.md), the harness can Read/Grep
          # all of it, and Actions logs are a separate 90-day-retained,
          # downloadable surface that travels with any future visibility change.
          # GitHub's masking only covers registered secrets, literally matched.
          # What makes debug runs tolerable when needed: this workflow mounts NO
          # DATABASE_URL / RESEND_API_KEY / EODHD_API_KEY, so it has no live prod
          # reach. Enable per-run with -f debug=true when a run's findings are
          # otherwise unreadable (the result envelope alone cannot distinguish
          # "3 tests failed" from "nothing to report" — observed on run
          # 31595260041).
          show_full_output: ${{ inputs.debug }}
          prompt: |
            ${{ inputs.prompt }}

            ---
            Operating rules for this automated run (in addition to CLAUDE.md):
            - Work autonomously on the task above; prefer building, testing,
              and verifying over writing documentation.
            - Keep changes scoped to what the task requires; no broad
              refactors unless the task explicitly asks for one.
            - run_tests=${{ inputs.run_tests }}: when true and you changed
              code, run the relevant pytest selection (plus ruff/mypy on
              touched files) and report results before declaring done.
            - If you change files: work on a branch named claude/<short-slug>
              (never main), commit, push the branch, open the pull request
              READY with its reversal-cost class and reversal cost, and land it
              per AGENTS.md §8 once required checks pass on its current head.
            - Continue through recoverable failures inside the task scope
              (test, lint, type, dependency-resolution, merge-base, or CI
              validation failures) by fixing, rerunning, and reporting the
              final status.
            - If no changes are needed: make no commits and finish with a
              concise summary of what you checked and found.
            - STOP and report the exact blocker instead of proceeding if the
              task would reach AGENTS.md §2 — a real capital action, a change
              to north-star.md or the personal-use invariant, or spend above
              the A$50/day cap — or if it needs a secret VALUE created or
              revealed (you name and scope a slot; James pastes the value).
              Never apply migration 0042. Never use Model A output in any
              decision basis (CLAUDE.md rule #11).
            - Never print secret or environment-variable values into logs,
              commits, or PR text.
          claude_args: |
            --max-turns ${{ inputs.max_turns }}
            --permission-mode auto
            # Unattended host: nobody can answer a permission prompt, so anything
            # that would prompt is denied outright instead of retried against the
            # turn budget. Auto mode still decides everything else, and a
            # PreToolUse hook deny (secrets-guard.sh) is upstream of this and
            # unaffected -- verified by an A/B headless probe, 2026-09-14.
            --permission-prompts none
            --mcp-config .github/runner/mcp.json
