# Nightly full-suite run against main.
#
# Why this exists when full-check.yml already runs the same suite: full-check
# fires on push/PR, so it only ever sees the days and times someone happens to
# push. This runs 7 days a week on a fixed clock, which is what surfaces
# weekend- and trading-day-dependent assumptions — the class of bug that passes
# every weekday PR run and fails on a Saturday.
#
# It also watches main itself. full-check's last word on main is whatever the
# merge commit said; a dependency resolving differently a week later (this repo
# does not pin transitively) changes nothing in git and is invisible until the
# next push. A scheduled run on a fixed ref is the only thing that catches it.
#
# The heartbeat step is the point of the `if: success()` guard: Healthchecks
# alerts on a MISSING ping, so a run that is delayed, silently dropped by
# GitHub, or disabled outright fires the deadman even though no job ever ran to
# report its own failure. A workflow that can only report failures it is alive
# to observe is not a watchdog — the same argument pipeline-health.yml makes for
# living outside daily-brief.yml.
#
# Honest limitations, stated rather than discovered later:
#   - `schedule:` only fires from the default branch, so this file must merge to
#     main before the schedule is live. workflow_dispatch works immediately.
#   - GitHub cron is best-effort. Its docs state runs "can be delayed during
#     periods of high loads" and that "some queued jobs may be dropped." The
#     off-the-hour minute below reduces that exposure; it does not remove it.
#     The heartbeat is what makes a dropped run visible rather than silent.
#   - HC_NIGHTLY_URL left unset skips the ping silently, matching existing
#     JobMonitor behaviour. GitHub's own run-failure notifications cover the
#     failure case in the interim, but NOT the never-ran case.
#
# The `routine-ledger` job below is a SECOND, unrelated watchdog that lives here
# only because this is the one lane already on a daily clock with no production
# secret. It asks whether each overnight Routine actually fired and closed (K-08),
# and it is a separate job precisely so the failing job NAME distinguishes "the
# suite broke on main" from "a Routine died" — two reds needing two responses.
# Its own limitation is the one this header already states about the heartbeat:
# if this workflow is dropped, the ledger check does not run either, and its
# silence looks like success. It detects a dead Routine, not a dead GitHub. That
# residual is what K-08's three healthchecks.io URLs buy, and is why K-08 stays
# open rather than closing with this.

name: nightly-check

on:
  schedule:
    # 15:17 UTC daily. Two deliberate choices:
    #   :17 — off the top of the hour, where GitHub's documented scheduler
    #         backlog concentrates.
    #   15  — puts the UTC date and the Sydney date on different calendar days
    #         year-round, across both AEST (+10) and AEDT (+11). Any code that
    #         conflates "today" in the two zones fails here and nowhere else.
    - cron: "17 15 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (ml + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Test (full pytest suite)
        run: python -m pytest -q

      - name: Heartbeat
        if: success()
        run: |
          set -euo pipefail
          if [ -z "${HC_NIGHTLY_URL:-}" ]; then
            echo "HC_NIGHTLY_URL unset — skipping deadman ping."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$HC_NIGHTLY_URL"
        env:
          HC_NIGHTLY_URL: ${{ secrets.HC_NIGHTLY_URL }}

  # Did each Routine fire, and finish, when its own doc's frontmatter says it
  # should? `_preamble.md` §1's START comment is the detector for a session that
  # woke and could do nothing; until now the only reader was `nightly-steward`,
  # itself a Routine, so every agent being dead was the one case no agent could
  # report.
  #
  # Separate job on purpose: it shares nothing with the suite above, needs no
  # dependency install, and must be identifiable by name in the run list.
  routine-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read  # read the routines ledger issue's comments; no write anywhere
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Network I/O lives in the caller, the script is pure over its stdin — the
      # same split `asxos/ingestion/regulatory.py` documents, so the judging
      # logic is testable against fixtures rather than against GitHub.
      #
      # LOOKBACK is 10 days, and it is derived, not chosen: `required_lookback_days`
      # takes the longest cron period across the routine docs (weekly-security is
      # 7) plus slack, and a test pins the number below against it. The first
      # version of this step used 3 days on the reasoning that a fire's deadline is
      # only budget + 3h away — true, and irrelevant: the FIRE can be a whole
      # period back, so on a Saturday weekly-security's last expected START is
      # nearly 7 days old and a 3-day fetch would have reported a healthy routine
      # dead. Crying wolf is a watchdog's first failure mode.
      #
      # PAGINATION IS EXPLICIT for the same reason. 10 days of ledger comfortably
      # exceeds one page, and a truncated fetch looks exactly like a missing START.
      # The loop walks pages until one comes back short; it never assumes a single
      # page was the whole ledger.
      - name: Check the routines ledger
        run: |
          set -euo pipefail
          since="$(date -u -d '10 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          page=1
          : > /tmp/ledger-pages.json
          while : ; do
            curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/270/comments?since=${since}&per_page=100&page=${page}" \
              > "/tmp/ledger-page-${page}.json"
            count="$(jq 'length' "/tmp/ledger-page-${page}.json")"
            echo "page ${page}: ${count} comments"
            if [ "$count" -lt 100 ]; then break; fi
            page=$((page + 1))
            if [ "$page" -gt 20 ]; then
              echo "more than 20 pages of ledger since ${since} — refusing to judge a partial fetch" >&2
              exit 1
            fi
          done
          jq -s 'add' /tmp/ledger-page-*.json | python scripts/check_routine_ledger.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
