# Name-based drift check: applied ledger vs migrations/ on disk.
#
# THIS IS NOT A STEP IN full-check.yml. Two reasons, both load-bearing:
#
#   1. The failure this exists to catch is a migration applied to production
#      with no repo change. That produces no PR by definition, so a PR-only
#      trigger cannot see it. The schedule is the real trigger; the
#      pull_request paths filter only catches the inverse (a file committed
#      without being applied).
#
#   2. full-check runs on every push to claude/**. Coupling that lane to
#      production DB reachability would turn a brief Supabase blip into a red
#      check on unrelated PRs. This workflow failing on a Supabase outage is
#      still a red scheduled run — that is the accepted cost of paging on
#      genuine drift. It is not an accepted cost of the whole PR gate.
#
# Exit codes from scripts/check_migration_drift.py: 0 agree · 1 drift ·
# 2 DATABASE_URL missing. The script opens a read-only session
# (default_transaction_read_only=on) and issues one SELECT against
# supabase_migrations.schema_migrations.
#
# GitHub cron only fires from the default branch. workflow_dispatch works
# from any ref after merge, and from this file once it is on main.

name: migration-drift

on:
  schedule:
    - cron: "0 6 * * *"          # daily; the drift this exists to catch produces no PR
  # No pull_request trigger: this workflow carries a repository secret
  # (DATABASE_URL), and running it at the head of an agent-authored PR is the
  # exposure ACP phase P1 exists to close. Drift is caught by the daily cron,
  # and a migration PR can dispatch it on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/heads/main

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migration drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_migration_drift.py
