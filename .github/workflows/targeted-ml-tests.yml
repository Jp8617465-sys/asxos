name: targeted-ml-tests

# Formerly the targeted ML model-safety gate (v1_5/v1_6 train/serve parity,
# model artefact / feature-engine / loader contracts). Model A's training
# chain, artefacts, and those tests were retired 2026-08-19 — rule #11's
# quarantine mechanism (asxos/domain/models/production_gate.py) stays, but
# there is no longer a model-training surface for this lane to target.
#
# Kept as a workflow (not deleted) because branch protection may still name
# it as a required check; retiring the check name itself needs a separate,
# deliberate branch-protection change, not a side effect of this deletion.
# What's left is the price-coverage data-trust helpers and the brief-compose
# contract (Ruff also still runs over asxos/domain/models/ and the now-empty
# asxos/domain/signals/ stub for hygiene), all already covered by
# full-check.yml's whole-suite run — this lane is now redundant with
# full-check and a candidate for retirement once the branch-protection
# required-check list is updated to drop it.
#
# No live database, no secrets, no deploy. The targeted tests mock
# asxos.db.acquire or use synthetic panels, so DATABASE_URL / Supabase
# credentials are intentionally NOT required.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-ml-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install (ml + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Ruff (model + signal modules + remaining targeted tests)
        run: |
          ruff check \
            asxos/domain/models/ \
            asxos/domain/signals/ \
            tests/test_price_coverage.py \
            tests/test_brief_compose.py

      - name: Remaining targeted tests (data-trust + brief-compose contracts)
        run: |
          python -m pytest -q \
            tests/test_price_coverage.py \
            tests/test_brief_compose.py
