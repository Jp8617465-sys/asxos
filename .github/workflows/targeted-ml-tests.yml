name: targeted-ml-tests

# Targeted ML model-safety gate. Deliberately NOT the full suite — it runs only
# the tests that validate v1_5/v1_6 train/serve parity, the price-coverage data-
# trust helpers, and the model artefact / feature-engine / loader contracts.
#
# No live database, no secrets, no Render, no deploy. The targeted tests mock
# asxos.db.acquire or use synthetic panels, so DATABASE_URL / RENDER_API_KEY /
# Supabase credentials are intentionally NOT required.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-ml-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (ml + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Ruff (model + signal modules + targeted tests)
        run: |
          ruff check \
            asxos/domain/models/ \
            asxos/domain/signals/ \
            tests/test_model_artifact_contract.py \
            tests/test_signal_correctness_contract.py \
            tests/test_build_target_price_basis.py \
            tests/test_price_coverage.py \
            tests/test_feature_engine.py \
            tests/test_signals_loader.py \
            tests/test_train_walk_forward.py \
            tests/test_training_config.py \
            tests/test_retrain_wiring.py

      - name: Targeted ML tests (v1_5/v1_6 parity + data-trust + contracts)
        run: |
          python -m pytest -q \
            tests/test_model_artifact_contract.py \
            tests/test_signal_correctness_contract.py \
            tests/test_build_target_price_basis.py \
            tests/test_price_coverage.py \
            tests/test_feature_engine.py \
            tests/test_signals_loader.py \
            tests/test_train_walk_forward.py \
            tests/test_training_config.py \
            tests/test_retrain_wiring.py
