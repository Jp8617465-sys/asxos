name: PR Review Agent

on:
  # No pull_request trigger, for the same reason as migration-drift.yml: this
  # workflow is secret-bearing (OPENAI_API_KEY) and must not run at the head of
  # an agent-authored PR (ACP phase P1). Post-merge on main only.
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review:
    name: Comment-only automated review
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.2' }}
      REVIEW_MAX_DIFF_CHARS: "60000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run comment-only review
        run: python3 scripts/pr_review_agent.py
