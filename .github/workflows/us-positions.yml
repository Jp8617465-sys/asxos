# US position monitor — its own schedule because US market close (13:30 UTC
# Mon-Fri check, after NYSE close) doesn't align with the AU daily chain.
# Alert-only: reads positions + prices, emails on stop/target/trajectory
# breaches. The founding failure this exists to prevent: a HUBS stop breach
# went unseen for three weeks because alert crons were never provisioned
# (north-star §criteria).

name: us-positions

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: us-positions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BRIEF_FROM_EMAIL: ${{ secrets.BRIEF_FROM_EMAIL }}
      BRIEF_TO_EMAIL: ${{ secrets.BRIEF_TO_EMAIL }}
      ASXOS_PERSONAL_USE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[ml]"

      - name: Check US positions
        run: python jobs/check_us_positions.py
