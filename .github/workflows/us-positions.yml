# US position monitor — its own schedule because US market close (21:30 UTC
# Mon-Fri check, after NYSE close) doesn't align with the AU daily chain.
# 21:30 UTC is 16:30 ET under EST (UTC-5) and 17:30 ET under EDT (UTC-4), so the
# check always lands after the 16:00 ET close on both sides of the DST boundary.
# It ran at 13:30 UTC until 2026-08-12 — that is 08:30/09:30 ET, i.e. market
# *open*, so every alert reflected the prior session's stale closing prices.
# Note the EST margin is only 30 minutes past the close; if consolidated closing
# prices prove not to be final that early, move this later rather than earlier.
# Alert-only: reads positions + prices, emails on stop/target/trajectory
# breaches. The founding failure this exists to prevent: a HUBS stop breach
# went unseen for three weeks because alert crons were never provisioned
# (north-star §criteria).

name: us-positions

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: us-positions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BRIEF_FROM_EMAIL: ${{ secrets.BRIEF_FROM_EMAIL }}
      BRIEF_TO_EMAIL: ${{ secrets.BRIEF_TO_EMAIL }}
      ASXOS_PERSONAL_USE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[ml]"

      - name: Check US positions
        run: python jobs/check_us_positions.py
