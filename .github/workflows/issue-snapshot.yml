# Recurring GitHub Issues snapshot — ADR §5.4 / D10 mitigation.
#
# THIS IS NOT A STEP IN full-check.yml. Two reasons, both load-bearing:
#
#   1. The failure this exists to catch is Issues moving on GitHub with no
#      repo change. That produces no PR by definition, so a PR-only trigger
#      cannot see it. The schedule is the real trigger.
#
#   2. full-check runs on every push to claude/**. Coupling that lane to the
#      GitHub Issues API would turn a token/scope blip into a red check on
#      unrelated PRs. This workflow failing on a 403 is still a red scheduled
#      run — that is the accepted cost of paging on a missing snapshot. It is
#      not an accepted cost of the whole PR gate.
#
# Commits docs/ops/github-issues-snapshot.json on main when the payload
# changed. full-check.yml paths-ignore that file so a snapshot-only push does
# not run the full pytest suite. GitHub cron only fires from the default
# branch. workflow_dispatch works from any ref after merge.

name: issue-snapshot

on:
  schedule:
    - cron: "0 7 * * *"          # daily 07:00 UTC; staggered from migration-drift 06:00
  workflow_dispatch:

concurrency:
  group: issue-snapshot
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/export_github_issues.sh

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ops/github-issues-snapshot.json
          if git diff --staged --quiet; then
            echo "issue snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(ops): refresh GitHub issues snapshot"
          git push
