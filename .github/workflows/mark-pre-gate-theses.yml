# Mark the pre-gate theses (one-off).
#
# WHY THIS EXISTS. Theses 1 (CBA.AU) and 2 (HUBS.NYSE) are the only rows at
# governance_status = 'approved' with zero thesis_evidence rows. Their 'approved'
# is not an approval: it is the column DEFAULT that migration 0059 dropped on
# 2026-09-17, taken before approve_object()'s evidence gate and the
# thesis_evidence writer existed (both 2026-09-16). 0059 closed the mechanism; it
# did not retro-correct the rows already laundered through it. This lane does,
# through the same svc.retire_object() that `asx thesis retire` uses.
#
# Neither row is backfilled with evidence. CBA is a demo fixture and HUBS is an
# ESPP acquisition; writing evidence for either would manufacture a basis for a
# decision nobody made, which is the failure the evidence architecture exists to
# prevent. The reasoning text on each governance_events row IS the marking.
#
# WHY DISPATCH-ONLY. It corrects two specific rows by hardcoded id and is
# idempotent -- a second run finds them retired and writes nothing. There is no
# schedule and there should never be one.
#
# WHAT IT NEVER TOUCHES. holding_lots and current_holdings: the HUBS POSITION
# stays fully visible and fully counted, and every portfolio surface reads from
# there rather than from theses. It writes no thesis_evidence row, no
# thesis_revisions row, and never theses.last_revisited_at or revisit_due_at --
# discipline.py's invariant that every clock reset is a human keystroke stands.
#
# WHAT THIS EXPOSES (AGENTS.md §8 -- a workflow edit is Amber and must record
# which secrets, which triggers, which branches run it):
#   - Secrets: DATABASE_URL only. No EODHD, FRED, RESEND, GitHub or Supabase
#     token. ASXOS_PERSONAL_USE=1 is the s766B firewall the job requires.
#   - Trigger: workflow_dispatch only. No schedule, no repo event.
#   - Branch: checks out refs/heads/main, like every production workflow.
#
# WHAT IT WRITES. With `persist: false` (the DEFAULT) it writes NOTHING: it reads
# both rows, refuses if either has moved from the state this correction assumes,
# prints what it would write, and opens no write path. With `persist: true` it
# writes, per thesis, one governance_events row then one theses UPDATE in that
# order in one transaction -- the order migration 0034's BEFORE UPDATE trigger
# requires -- plus one job_runs row via JobMonitor.

name: mark-pre-gate-theses

on:
  workflow_dispatch:
    inputs:
      persist:
        description: "Write the retirements. Unchecked = dry-run, write nothing."
        required: false
        default: false
        type: boolean

concurrency:
  group: mark-pre-gate-theses
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ASXOS_PERSONAL_USE: "1"
      ASXOS_TZ: "Australia/Sydney"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/heads/main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Mark the two theses that were approved before the gate existed
        run: |
          python jobs/mark_pre_gate_theses.py \
            ${{ inputs.persist && '--persist' || '' }}
