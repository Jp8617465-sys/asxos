name: full-check

# Full deterministic gate: ruff + mypy + the entire pytest suite (`make check`).
# Complements targeted-ml-tests.yml (the fast ML-safety lane) by covering the
# domains that lane deliberately skips — tax, portfolio, brief, regime, etc. A
# logic regression outside models/ or signals/ is caught here, not in production.
#
# Installs the ml + dev extras so the full suite (including LightGBM/sklearn
# tests) collects and runs; this matches the env where `pip install -e ".[ml]"`
# is expected, so the documented sandbox-only ML collection gaps do not apply.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

# Ref-scoped, unlike the static singleton groups on the scheduled workflows
# (backup, daily-brief, …). Those exist to stop a job overlapping ITSELF; a
# static group here would serialise every branch behind one queue and cancel
# nothing. Superseded runs measured 2026-08-23: 26 of the last 100 runs were
# still in flight when a later push landed on the same branch.
#
# `main` never cancels — it is the continuous-deploy trigger, and a cancelled
# run there would leave the deployed state unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          # No requirements.txt in this repo — pyproject.toml is the manifest
          # (PEP 621), so it is what the cache key hashes — the same key the
          # scheduled workflows use (daily-brief, nightly-check, …), not a
          # first. The heavy half of the install is the ml extra
          # (lightgbm/shap/scikit-learn; shap builds llvmlite), which is what
          # makes the cache worth having.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (ml + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Lint (ruff, whole repo)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy asxos

      - name: Test (full pytest suite)
        run: python -m pytest -q
