target-version = "py312"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "RUF001", # ambiguous Unicode in strings — intentional math notation (×, −, ∪)
    "RUF002", # ambiguous Unicode in docstrings — intentional math notation
    "RUF003", # ambiguous Unicode in comments — intentional math notation
]

[lint.isort]
known-first-party = ["asxos"]

[format]
quote-style = "double"
indent-style = "space"
