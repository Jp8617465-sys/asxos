# docs/product/backlog.yaml — the machine twin of the live queue.
#
# Amendment K (James, 2026-09-05). The Stages 0→6 table in roadmap-state.md stays the
# HUMAN queue and the only ranked one; this file is what a script can rank. It is read by
# `asxos/backlog.py` (via `scripts/backlog_next.py`) — the picker for the `backlog-roll`
# standing lane — and by nobody else. When the two disagree, roadmap-state.md wins and
# this file is wrong.
#
# Seeded 2026-09-05 from the de-duplicated 74-row inventory of that day's /arbi wake
# (campaign plan H-nodes, the 2026-09-03 click-list, the open PR set, roadmap-state's
# live/parked/deferred sections, james-inbox open rows, risk-register). Where two sources
# disagreed, the fresher one was used and is the one cited.
#
# Schema (validated by the picker; unknown values exit 2):
#   id          A-0 … E-99. Stable. Never reuse.
#   phase       A land-what's-built · B James infra · C live-observation gates ·
#               D governor rulings · E deferred/parked
#   owner       arbi | james | both | time
#   status      done | built-unmerged | open | blocked | parked | void
#               "built-unmerged" = the artifact exists as a PR; it is NOT done.
#               Dependencies count as met only when the dependency is done or void.
#   route       build     one-file reversible, /build
#               mission   multi-node reversible, /arbi-mission
#               attended  arbi's, but needs a live session (merge, force-push, capital
#                         or tax reasoning, DB probes) — never picked by the lane
#               james     James's click / ruling / secret / apply
#               observe   nothing to do; wait and read
#   depends_on  ids that must be done|void first
#   paths       files the work touches. Eligibility is DERIVED: every path must fall
#               outside the denied set the picker copies from unattended-guard.sh and
#               settings.json. This file cannot declare something safe that the guard
#               would refuse — the drift test pins that.
#   source      file:line, PR#, or click id — where the claim came from
#
# The lane's first product is the click-list — every James item whose dependencies are
# met. Its second is the residue it may build. Most fires will exit 3 with only the
# click-list, and that is correct.

