  - id: C-20
    title: "currency missing on 72,904 rs_financial_statements rows (10.4%) across 1,177 symbols — blank string as well as NULL; fix the ingest path before any backfill"
    phase: C
    owner: both
    status: open
    depends_on: []
    route: attended
    paths: ["asxos/ingestion/financial_statements.py", "asxos/ingestion/fundamentals_pit.py"]
    source: >-
      Found 2026-09-08 valuing CBA.AU (FY26 row, currency NULL). Rescoped twice.
      FIRST COUNT WAS WRONG: `currency IS NULL` finds 70,393 rows, but 2,511 more
      carry an EMPTY STRING, which that predicate misses. True total 72,904 rows
      (10.4%) across 1,177 symbols. financial_statements.py:222-231 already warns
      about exactly this: the correct predicate on THIS table is
      `WHERE (currency IS NULL OR btrim(coalesce(currency,'')) = '')`.
      (a) ROOT CAUSE, established before proposing any backfill: the loader is NOT
      dropping the field. financial_statements.py:231 reads
      `st.get("currency_symbol") or block.get("currency_symbol") or None` — it
      tries statement level, then the fundamentals block, then records absence
      honestly. The provider supplies blank or nothing for these rows. The `or
      None` guard already converts '' to NULL for rows written FROM NOW ON;
      legacy blank rows were never backfilled, and whitespace-only values are
      still not caught (documented limits 1 and 2 at :222-230).
      (b) BACKFILL SCOPE, measured: of the 1,177 affected symbols, 954 report
      exactly one currency on some other period and are safely propagatable
      (62,386 rows) — recorded as INFERRED, never as reported, in a separate
      column, never written into the currency field. 101 symbols have no currency
      on any period (3,394 rows) and stay NULL under (c).
      (b2) NOT ANTICIPATED, NEEDS A RULE: 122 symbols report MORE THAN ONE
      currency across their periods. Propagation is ambiguous for these — a
      genuine reporting-currency change is indistinguishable from a data error
      without a rule. Do not include them in the (b) sweep.
      (c) Whatever remains stays NULL and keeps blocking. A blocked valuation is a
      correct outcome; a valuation on an assumed currency is not.
      REJECTED (James, 2026-09-08): a blanket AUD default. ASX-listed is not
      AUD-reporting — measured, 329 symbols report USD and 84 NZD, plus EUR/CAD/
      CNY/INR/GBP across 20 distinct currencies. A default true for most rows is
      silently false for exactly the rows where currency matters most.

  - id: C-21
    title: "A dated third-party beta band belongs in the provenance record alongside rf and ERP, not as a bare module constant"
    phase: C
    owner: arbi
    status: open
    depends_on: []
    route: attended
    paths: ["asxos/domain/valuation/capm.py", "asxos/domain/valuation/types.py"]
    source: >-
      Filed 2026-09-08 by James's ruling. capm.BETA_LOW/BETA_HIGH carry a cited
      third-party band (Finbox/Simply Wall St/Yahoo Finance five-year estimates,
      reviewed 2026-09-08) as module constants with the source in a comment. rf
      comes from market_context with an as_of, and ERP is a required CLI argument
      with a required citation — beta is the only one of the three CAPM inputs
      whose source and date are not carried on the artifact itself. The failure
      this prevents already happened once in this project: the band shipped at
      0.90-1.20 while the reviewed figure was 0.55-0.85, and nothing in the output
      would have shown the disagreement. Move the band, its source string and its
      as-of into CostOfEquityInputs so a run states which band it used, and make a
      band change a data change rather than a code change.

  - id: C-22
    title: "Reporting-currency changepoints break multi-period comparability — 122 symbols have series (growth, ROE, margins) that cross a currency boundary and are wrong un-translated, NULL rows or not"
    phase: C
    owner: arbi
    status: open
    depends_on: []
    route: attended
    paths: ["asxos/domain/research/factor_scores.py", "asxos/ingestion/fundamentals_pit.py"]
    source: >-
      Filed 2026-09-08 by James's ruling, deliberately SEPARATE from the C-20
      backfill and not blocking it. Measured: 122 symbols report more than one
      currency across their periods in rs_financial_statements. Any such symbol
      has multi-period series — revenue growth, ROE, margin trend — computed
      across a reporting-currency change. Those series are wrong un-translated
      WHETHER OR NOT any row is NULL, so filling the gaps does not fix them and
      a symbol with complete currency data can still be affected. Consumers at
      risk are anything deriving a multi-period ratio or trend, starting with
      factor_scores.raw_factors. Decide whether such series are translated at a
      stated rate, or refused with a named gap the way a NULL currency now is.

