    source: >-
      Measured 2026-09-15 by the first daily-product fire (supabase-ro): regulatory_events
      has 7 rows total, all source=RBA, max(ingested_at) 2026-09-03 22:44 UTC,
      max(published_at) 2026-09-03, 1 row ingested in the last 14 days; job_runs shows
      ingest_regulatory success with rows_written=1 on every night 09-07 to 09-14.
      asxos/ingestion/regulatory.py::upsert_events returns len(rows) after ON CONFLICT DO
      UPDATE, so rows_written=1 means one parsed item re-touched nightly, not one new row.
