  "release_gates": {
    "operational_gate": {
      "id": "GATE-OPERATIONAL",
      "purpose": "Permit staging eligibility as explicitly UNCALIBRATED only after final-lineage prospective reliability is proven.",
      "criteria": [
        "At least 30 consecutive clean prospective sessions after the final S12 construction/risk/sizing/staging/fill/accounting/benchmark/evaluator/code lineage is frozen and James authorises hidden observation.",
        "Every qualifying session replays bit-identically and at least 99.5% of required NAV-days are priced.",
        "Zero unresolved material price, FX, corporate-action, tax, cost, accounting, general-data, or reconciliation defects.",
        "Genuine point-in-time XJO-TR, effective fee schedule, complete required tax/accounting coverage, and exact source identities are present.",
        "Structural and perturbation Model A isolation passes and there is no broker-boundary violation.",
        "One unique effective James-ratified construction, risk, and staging policy bundle covers the cohort."
      ],
      "failure_state": "PAPER_ONLY",
      "allows": "UNCALIBRATED",
      "reset_conditions": [
        "A material policy, contract, code, data-source, benchmark, fill, accounting, tax, statistics, risk, sizing, staging, or capital-boundary semantic changes.",
        "A qualifying session is incomplete, dirty, non-reproducible, rewritten, reconstructed, or backfilled.",
        "Model A, unavailable future data, or a broker capability reaches the capital/evidence path."
      ],
      "evidence_paths": [
        "docs/programs/investment-engine/sprints/s11-nav-outcomes-and-evidence-gates.md",
        "docs/programs/investment-engine/acceptance-matrix.md",
        "docs/programs/investment-engine/operations-and-rollout.md"
      ]
    },
    "strategy_gate": {
      "id": "GATE-STRATEGY",
      "purpose": "Permit an evidence-backed edge assessment only after adequate prospective exposure and every frozen statistical/financial predicate.",
      "criteria": [
        "At least 252 prospective clean paired daily sessions and 20 matured pre-registered origins, each observed through 63 sessions; origins may overlap and must report dependency/effective-sample diagnostics.",
        "One primary candidate and all construction, risk, sizing, staging, fill, accounting, tax, benchmark, evaluator, code, schema, data, calendar and statistical versions remain fixed.",
        "Stress after-tax-estimate, after-cost active return is positive versus hold and genuine XJO-TR.",
        "The pinned one-sided 90% paired circular moving-block-bootstrap lower bound is positive for both comparisons.",
        "At least 95% of positive intended notional fills within five eligible sessions; actual capital utilisation/capacity is reported.",
        "There are zero policy breaches and drawdown remains inside James's ratified mandate.",
        "Open, blocked, rejected, no-action, expired, unfilled, missing, candidate-selection and regime information is reported without denominator editing."
      ],
      "failure_state": "UNCALIBRATED",
      "allows": "EVIDENCE_BACKED",
      "reset_conditions": [
        "A material primary-candidate or prospective semantic change starts a new cohort.",
        "Benchmark, tax, cost, fill, hold, drawdown, bootstrap, maturity, count, or capacity reconciliation fails.",
        "Records are deleted, rewritten, selectively excluded, or moved between cohorts after outcomes."
      ],
      "evidence_paths": [
        "docs/programs/investment-engine/contracts/paper-evaluator-v1.md",
        "docs/programs/investment-engine/sprints/s11-nav-outcomes-and-evidence-gates.md",
        "docs/programs/investment-engine/acceptance-matrix.md"
      ]
    },
    "promotion_gate": {
      "id": "GATE-PROMOTION",
      "purpose": "Require James to decide evidence language after immutable operational and strategy decisions; execution authority never changes.",
      "criteria": [
        "The immutable operational-gate decision passes.",
        "The immutable strategy-gate decision passes.",
        "The complete evidence packet and every typed hash resolves.",
        "James records promotion-decision-v1=APPROVED over that exact packet."
      ],
      "failure_state": "UNCALIBRATED",
      "allows": "EVIDENCE_BACKED",
      "reset_conditions": [
        "James withdraws promotion.",
        "A pinned version changes.",
        "A material integrity defect invalidates the packet."
      ],
      "evidence_paths": [
        "docs/programs/investment-engine/contracts/promotion-decision-v1.md",
        "docs/programs/investment-engine/decisions.md",
        "docs/programs/investment-engine/operations-and-rollout.md"
      ]
    }
  },
  "delivery_policy": {
    "surfaces": ["cli", "daily_brief"],
    "excluded_surfaces": ["web", "mobile", "multi_user", "public_advice", "broker_connection", "order_execution"],
    "execution_boundary": [
