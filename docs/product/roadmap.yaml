      "id": "NS-CUD",
      "name": "Capital Under Discipline",
      "definition": "Eligible invested XASX NAV backed by a current evidence-complete report, exact independent review, monitor watermark, ratified policy, deterministic target/sizing proof, and reconciled accounting, divided by total eligible invested NAV.",
      "measurement": "Publish disciplined and eligible NAV, ratio, each excluded holding and exact exclusion reason for every complete session.",
      "target": "Increase governed coverage without weakening evidence, freshness, policy, accounting, Model A isolation, or manual-execution gates.",
      "evidence_paths": [
        "docs/programs/investment-engine/architecture.md",
        "docs/programs/investment-engine/contracts/investment-case-lineage-v1.md",
        "docs/programs/investment-engine/acceptance-matrix.md"
