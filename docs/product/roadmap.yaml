        "Finance, risk, tax, accounting, fill, benchmark and statistical semantics.",
        "Migrations, capital boundaries, authority boundaries, and root-cause escalation.",
        "Fresh-context independent red-team before sprint close."
      ],
      "repair_escalation_after_failed_cycles": 2
    },
    "pull_request_budget": {
