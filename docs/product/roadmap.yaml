      "ASXOS cannot place, route, submit, modify, cancel, infer, or observe an external broker order or fill."
    ],
    "model_routing": {
      "fable_low": "Frozen schemas, fixtures, pure implementations, adapters, rendering and bounded repairs only.",
      "opus_ultra": [
