# asxos Render IaC manifest.
#
# This file is the source of truth for what Render runs.  Every change goes
# through `render.yaml` + `git push` — never the Render dashboard.
# `make check-drift` reconciles the live state against this file after every
# deploy (CLAUDE.md non-negotiable #2).
#
# Layout:
#   - 1 web service:    asxos-api
#   - 16 cron services: sync-universe, sync-prices, sync-fundamentals,
#                       generate-signals, ingest-regulatory, ingest-news,
#                       ingest-sentiment, compose-brief, retrain-model-a,
#                       build-portfolio, snapshot-portfolio,
#                       ingest-market-context, ingest-underlyings,
#                       compute-opportunity-cost, detect-theme-stages,
#                       check-cron-health, backup-irreplaceable,
#                       check-au-positions, check-thesis-invalidations
#
# Healthchecks.io pings are emitted from inside each Python job via
# JobMonitor (see asxos/jobs/utils/job_monitor.py); the cron service itself
# does not need a separate ping wrapper.
#
# Cron schedules are UTC (Render requirement).  AEST = UTC+10, AEDT = UTC+11.
# Schedule comments below use AEST anchors; DST shift is acceptable for
# this workload — no schedule is tighter than 30 min from market events.

services:
  # ============================================================
  # FastAPI web service
  # ============================================================
  - type: web
    name: asxos-api
    runtime: python
    region: oregon  # closest free-tier region; latency to Supabase ap-southeast-2 ~250ms
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    startCommand: uvicorn asxos.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        sync: false        # uploaded via mcp__render__update_environment_variables
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: EODHD_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BRIEF_FROM_EMAIL
        sync: false
      - key: BRIEF_TO_EMAIL
        sync: false
      - key: ASXOS_API_TOKEN
        sync: false        # bearer required on every request from the crons
      - key: ASXOS_MODELS_DIR
        value: /opt/render/project/src/models
      - key: ASXOS_DATA_DIR
        value: /opt/render/project/src/data
      - key: ASXOS_TZ
        value: Australia/Sydney

  # ============================================================
  # Cron services — one per job
  # ============================================================

  # Weekly universe refresh — Sunday 02:00 AEST (Sat 16:00 UTC)
  - type: cron
    name: asxos-sync-universe
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "0 16 * * 6"
    command: python jobs/sync_universe.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: HEALTHCHECK_URL_SYNC_UNIVERSE
        sync: false

  # Daily price sync — 06:30 AEST weekdays (20:30 UTC prior day)
  - type: cron
    name: asxos-sync-prices
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "30 20 * * 0-4"  # Sun-Thu UTC = Mon-Fri AEST
    command: python jobs/sync_prices.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: HEALTHCHECK_URL_SYNC_PRICES
        sync: false

  # Daily fundamentals sync — 04:00 AEST (18:00 UTC prior day)
  - type: cron
    name: asxos-sync-fundamentals
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "0 18 * * *"
    command: python jobs/sync_fundamentals.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: HEALTHCHECK_URL_SYNC_FUNDAMENTALS
        sync: false

  # Signal generation — 06:50 AEST weekdays (20:50 UTC prior day)
  - type: cron
    name: asxos-generate-signals
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "50 20 * * 0-4"
    command: python jobs/generate_signals.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: HEALTHCHECK_URL_GENERATE_SIGNALS
        sync: false

  # Regulatory ingest — 06:55 AEST daily (20:55 UTC prior day)
  - type: cron
    name: asxos-ingest-regulatory
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "55 20 * * *"
    command: python jobs/ingest_regulatory.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: HEALTHCHECK_URL_INGEST_REGULATORY
        sync: false

  # News ingest — 06:57 AEST weekdays (20:57 UTC prior day)
  # Runs 3 min before compose_brief so news is ready when the brief assembles.
  - type: cron
    name: asxos-ingest-news
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "57 20 * * 0-4"
    command: python jobs/ingest_news.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ASXOS_PERSONAL_USE
        value: "1"
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: HEALTHCHECK_URL_INGEST_NEWS
        sync: false

  # Sentiment aggregation — 07:02 AEST weekdays (21:02 UTC prior day)
  # REV-K: aggregates daily mean polarity from holding_news → signal_sentiment (SQL only,
  # no EODHD API call). Runs AFTER ingest_news (20:57 UTC) to ensure today's articles
  # are available. Soft upstream guard checks ingest_news job_runs; logs WARNING on miss.
  - type: cron
    name: asxos-ingest-sentiment
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "2 21 * * 0-4"
    command: python jobs/ingest_sentiment.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ASXOS_PERSONAL_USE
        value: "1"
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - key: HEALTHCHECK_URL_INGEST_SENTIMENT
        sync: false

  # Morning brief — 07:00 AEST weekdays (21:00 UTC prior day)
  - type: cron
    name: asxos-compose-brief
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "0 21 * * 0-4"
    command: python jobs/compose_brief.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ASXOS_PERSONAL_USE
        value: "1"
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - fromService:
          type: web
          name: asxos-api
          envVarKey: RESEND_API_KEY
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_FROM_EMAIL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_TO_EMAIL
      - key: HEALTHCHECK_URL_COMPOSE_BRIEF
        sync: false
      - key: ASXOS_PORTFOLIO_BRIEF_ENABLED
        value: "0"        # flip to "1" via: asx portfolio signoff (M13.8)
      - key: ASXOS_NEWS_BRIEF_ENABLED
        value: "0"        # flip to "1" via: asx news signoff (M14a)
      - key: ASXOS_NEWS_ALLOCATOR_ENABLED
        value: "0"        # flip to "1" via: asx allocator-news signoff (M14c)

  # Retraining — Sunday 02:00 AEST (Sat 16:00 UTC)
  - type: cron
    name: asxos-retrain-model-a
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "0 16 * * 6"
    # Always uses next-numeric version suffix; operator activates via `asx model activate`
    command: python jobs/retrain_model_a.py --version v_auto_$(date +%Y%m%d)
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: HEALTHCHECK_URL_RETRAIN_MODEL_A
        sync: false

  # Weekly portfolio construction — Sunday 06:00 AEST (Sat 20:00 UTC).
  # Runs before Monday's brief so section 6 has a fresh run to read.
  # ASXOS_PORTFOLIO_BRIEF_ENABLED stays 0 until M13.8 paper-trade sign-off.
  - type: cron
    name: asxos-build-portfolio
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "0 20 * * 6"
    command: ASXOS_PERSONAL_USE=1 python jobs/build_portfolio.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: ASXOS_PERSONAL_USE
        value: "1"
      - key: ASXOS_PORTFOLIO_BRIEF_ENABLED
        value: "0"        # flip to "1" after M13.8 paper-trade sign-off
      - key: ASXOS_NEWS_ALLOCATOR_ENABLED
        value: "0"        # flip to "1" via: asx allocator-news signoff (M14c)
      - key: HEALTHCHECK_URL_BUILD_PORTFOLIO
        sync: false

  # Daily portfolio snapshot — 06:40 AEST weekdays (20:40 UTC prior day).
  # Runs after sync_prices (20:30 UTC) so prices are fresh; before
  # compose_brief (21:00 UTC) so the V2 brief's section 1 has today's row.
  # Re-derivable from prices + holding_lots; NOT in backup_irreplaceable.sh.
  - type: cron
    name: asxos-snapshot-portfolio
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "40 20 * * 0-4"
    command: ASXOS_PERSONAL_USE=1 python jobs/snapshot_portfolio.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ASXOS_PERSONAL_USE
        value: "1"
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - key: HEALTHCHECK_URL_SNAPSHOT_PORTFOLIO
        sync: false

  # Market context ingest — 06:45 AEST weekdays (20:45 UTC prior day).
  # Runs before generate_signals (20:50) so regime data is fresh for signal gate.
  - type: cron
    name: asxos-ingest-market-context
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "45 20 * * 0-4"
    command: python jobs/ingest_market_context.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: FRED_API_KEY
        sync: false
      - key: HEALTHCHECK_URL_INGEST_MARKET_CONTEXT
        sync: false

  # Underlying price ingest — 06:48 AEST weekdays (20:48 UTC prior day).
  # Runs after ingest_market_context (20:45) and before generate_signals (20:50).
  # Seeds catalog on first run; backfills from earliest holding_lot acquired_at.
  - type: cron
    name: asxos-ingest-underlyings
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "48 20 * * 0-4"
    command: python jobs/ingest_underlyings.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: EODHD_API_KEY
      - key: FRED_API_KEY
        sync: false
      - key: HEALTHCHECK_URL_INGEST_UNDERLYINGS
        sync: false

  # Opportunity cost computation — 20:05 UTC Saturday (after build_portfolio 20:00 Sat).
  # CGT-adjusted ranking of redeployment candidates per active thesis.
  # Populates opportunity_cost_scenarios for brief Section 10.
  - type: cron
    name: asxos-compute-opportunity-cost
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "5 20 * * 6"
    command: python jobs/compute_opportunity_cost.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - key: HEALTHCHECK_URL_COMPUTE_OPPORTUNITY_COST
        sync: false

  # Theme stage detection — 20:55 UTC (Sun-Thu), same slot as ingest-regulatory.
  # Classifies each active theme into lifecycle stage; updates stage_suggested
  # and stage_metadata. Never writes themes.stage (user-confirmed field).
  - type: cron
    name: asxos-detect-theme-stages
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "55 20 * * 0-4"
    command: python jobs/detect_theme_stages.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - key: HEALTHCHECK_URL_DETECT_THEME_STAGES
        sync: false

  # Pipeline health check — 08:00 AEST (22:00 UTC). Runs after the full pipeline
  # completes; detects stuck jobs, missing daily successes, consecutive failures.
  # Sends Resend alert on any finding; raises RuntimeError so Healthchecks.io fires.
  - type: cron
    name: asxos-check-cron-health
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "0 22 * * *"
    command: python jobs/check_cron_health.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: RESEND_API_KEY
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_FROM_EMAIL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_TO_EMAIL
      - key: HEALTHCHECK_URL_CHECK_CRON_HEALTH
        sync: false

  # US post-close position alerts — Mon-Fri 13:30 UTC (after NYSE close)
  - type: cron
    name: asxos-check-us-positions
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "30 13 * * 1-5"
    command: python jobs/check_us_positions.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ASXOS_PERSONAL_USE
        value: "1"
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: RESEND_API_KEY
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_FROM_EMAIL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_TO_EMAIL
      - key: HEALTHCHECK_URL_CHECK_US_POSITIONS
        sync: false

  # ASX post-close position alerts — weekdays 21:05 UTC (after sync_prices 20:30)
  - type: cron
    name: asxos-check-au-positions
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "5 21 * * 0-4"  # Sun-Thu UTC = Mon-Fri AEST
    command: python jobs/check_au_positions.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ASXOS_PERSONAL_USE
        value: "1"
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: RESEND_API_KEY
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_FROM_EMAIL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_TO_EMAIL
      - key: HEALTHCHECK_URL_CHECK_AU_POSITIONS
        sync: false

  # Thesis invalidation condition checker — daily 21:10 UTC
  - type: cron
    name: asxos-check-thesis-invalidations
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -e ".[ml]"
    schedule: "10 21 * * *"
    command: python jobs/check_thesis_invalidations.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ASXOS_PERSONAL_USE
        value: "1"
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: RESEND_API_KEY
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_FROM_EMAIL
      - fromService:
          type: web
          name: asxos-api
          envVarKey: BRIEF_TO_EMAIL
      - key: HEALTHCHECK_URL_CHECK_THESIS_INVALIDATIONS
        sync: false

  # Daily backup of irreplaceable tables — 23:30 AEST (13:30 UTC)
  - type: cron
    name: asxos-backup-irreplaceable
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: apt-get update && apt-get install -y postgresql-client && pip install -e .
    schedule: "30 13 * * *"
    command: bash scripts/backup_irreplaceable.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - fromService:
          type: web
          name: asxos-api
          envVarKey: DATABASE_URL
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: BACKUP_REPO
        sync: false
      - key: HEALTHCHECK_URL_BACKUP_IRREPLACEABLE
        sync: false
