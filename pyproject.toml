[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asxos"
version = "0.1.0"
description = "Personal investment intelligence OS for ASX equities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Private" }
authors = [{ name = "James Pcino" }]

dependencies = [
    # API + runtime
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.13",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    # Data
    "numpy==2.5.3",
    "pandas==3.0.5",
    "python-dateutil==2.9.0.post0",
    # Jobs + utilities
    "defusedxml==0.7.1",  # hardened XML parsing for untrusted RSS feeds (07-18 audit)
    "tenacity==9.1.4",
    "typer==0.27.2",
    "click<8.6",  # typer 0.27.2 is incompatible with click 8.2+ (make_metavar signature change)
    "rich==15.0.0",
    "jinja2==3.1.6",
    "resend==2.44.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
# ML deps are heavy (shap requires llvmlite/LLVM to compile).
# Install with: pip install -e ".[ml]"
# Required from M4 (signal generation) onward.
ml = [
    "lightgbm==4.7.0",
    "shap==0.52.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "types-python-dateutil==2.9.0.20260807",
    # tests/test_corporate_actions.py reads .github/workflows/weekly-research.yml to
    # assert the in-process deadline is a SHARE of the job-wide timeout. PyYAML was
    # resolving only transitively via uvicorn[standard]; an extras change upstream would
    # have turned that assertion into a collection error instead of a useful failure.
    "pyyaml==6.0.3",
    "types-PyYAML==6.0.12.20260906",
]
# Full install for CI and production: pip install -e ".[ml,dev]"
all = [
    "asxos[ml,dev]",
]

[project.scripts]
asx = "asxos.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "jobs*", "scripts*"]

[tool.setuptools.package-data]
# The sealed scenario pre-registration the valuation sweep registers before its
# first run (asxos/domain/valuation/preregistration.py). Editable installs find
# it in place; this line makes a wheel carry it too.
"asxos.domain.valuation" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# --continue-on-collection-errors was removed 2026-08-23. It was masking nothing:
# with the flag off, the suite collects clean both in CI (2640 passed, 1 skipped)
# and locally (2303 passed, 1 skipped, exit 0). The ML import chain it was
# originally added for (joblib/lightgbm via domain/models/cache.py) died with the
# Model A training-chain retirement in da64c1b. Leaving it on would let a genuine
# broken import degrade into a silent skip.
# --strict-config turns a typo in THIS block into an error instead of a default.
addopts = "-ra --strict-markers --strict-config"
# --strict-markers means this list is the whole registry: an unregistered
# marker is a collection error, not a silent no-op.
markers = [
    "network: test is permitted outbound network access; requires explicit opt-in and an entry in docs/ops/offline-test-inventory.json",
]

