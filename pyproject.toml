[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asxos"
version = "0.1.0"
description = "Personal investment intelligence OS for ASX equities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Private" }
authors = [{ name = "James Pcino" }]

dependencies = [
    # API + runtime
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
    # Data
    "numpy==2.1.1",
    "pandas==2.2.3",
    "python-dateutil==2.9.0.post0",
    # Jobs + utilities
    "defusedxml==0.7.1",  # hardened XML parsing for untrusted RSS feeds (07-18 audit)
    "tenacity==9.0.0",
    "typer==0.12.5",
    "click<8.2",  # typer 0.12.5 is incompatible with click 8.2+ (make_metavar signature change)
    "rich==13.9.2",
    "jinja2==3.1.4",
    "resend==2.4.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
# ML deps are heavy (shap requires llvmlite/LLVM to compile).
# Install with: pip install -e ".[ml]"
# Required from M4 (signal generation) onward.
ml = [
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.7.0",
    "mypy==1.11.2",
    "types-python-dateutil==2.9.0.20240906",
    # tests/test_corporate_actions.py reads .github/workflows/weekly-research.yml to
    # assert the in-process deadline is a SHARE of the job-wide timeout. PyYAML was
    # resolving only transitively via uvicorn[standard]; an extras change upstream would
    # have turned that assertion into a collection error instead of a useful failure.
    "pyyaml==6.0.3",
    "types-PyYAML==6.0.12.20240917",
]
# Full install for CI and production: pip install -e ".[ml,dev]"
all = [
    "asxos[ml,dev]",
]

[project.scripts]
asx = "asxos.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "jobs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --continue-on-collection-errors"

